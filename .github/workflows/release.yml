name: VEYRA release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tren-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify backend
        run: |
          python -c "import json; from build_release import build; build('.', 'TREN-v'+json.load(open('version.json'))['version']+'.zip')"
          python -m unittest discover -s tests -v
          node tests/ui_logic.cjs
          node --test desktop/test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: TREN-v*.zip
  desktop:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage first-install backend and runtimes
        run: python desktop/prepare-resources.py
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop transport and real Windows window smoke test
        working-directory: desktop
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TREN_DESKTOP_ROOT = (Resolve-Path '..').Path
          $env:TREN_PYTHON = (Get-Command python).Source
          $env:TREN_RESOURCES = (Resolve-Path 'resources').Path
          node_modules/.bin/electron.cmd . --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh install with bundled runtimes
        working-directory: desktop
        shell: pwsh
        run: |
          $env:TREN_RESOURCES = (Resolve-Path 'resources').Path
          node_modules/.bin/electron.cmd . --smoke-test --smoke-fresh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          npm run dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release-out | Out-Null
          Copy-Item dist/*.exe,dist/*.blockmap,dist/latest.yml,smoke-output/*.png release-out/
      - name: Real installer options and legacy-folder upgrade acceptance
        working-directory: desktop
        shell: pwsh
        run: |
          ./installer-smoke.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item smoke-output/VEYRA-Installer-options.png release-out/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: desktop/release-out/*
  publish:
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish only after both builds pass
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tag="v$(python -c 'import json; print(json.load(open("version.json"))["version"])')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its assets unchanged."
          else
            gh release create "$tag" release-assets/* --target "$SOURCE_SHA" --title "VEYRA $tag" --generate-notes
          fi
